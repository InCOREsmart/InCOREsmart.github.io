          if 'uiTranslations' not in s:
              s = s.replace('import { coreTranslations } from "./core";', 'import { coreTranslations } from "./core";\nimport { uiTranslations } from "./uiTranslations";')
              s = re.sub(r'const mergeLocale = \(base: any, extra: any\) => \(\{.*?\n\}\);', '''const mergeLocale = (base: any, extra: any) => {
            const merge = (a: any, b: any): any => {
              const out = { ...a };
              Object.entries(b || {}).forEach(([key, value]) => {
                out[key] = value && typeof value === 'object' && !Array.isArray(value)
                  ? merge(out[key] || {}, value)
                  : value;
              });
              return out;
            };
            return merge(merge(base, extra), uiTranslations[(extra === coreTranslations.ru ? 'ru' : extra === coreTranslations.en ? 'en' : extra === coreTranslations.kk ? 'kk' : 'az') as keyof typeof uiTranslations]);
          };''', s, flags=re.S)
