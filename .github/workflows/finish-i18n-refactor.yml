rview: 'Компанияның негізгі қаржылық көрсеткіштері', cashMovementAugust: 'Тамыздағы ақша қозғалысы', inEscrow: 'Эскроуда', paidInAugust: 'Тамызда төленді', pendingPayout: 'Төлем күтілуде', agentPlanAchievement: 'Агенттердің жоспарды орындауы', planAchievementDescription: 'Белсенді келісімшарттар бойынша жоспарды орындау пайызы', critical: 'Маңызды', overachieved: 'Артық орындау', planAchievement: 'Жоспарды орындау' } },
