          files = list((root / 'agent').glob('*.tsx')) + list((root / 'ceo').glob('*.tsx'))

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for src, dst in replacements.items():
                  # Replace JSX text nodes containing the exact literal.
                  text = text.replace(f'>{src}<', f'>{dst}<')
                  # Replace quoted literals in JS/TS strings where the destination is safe.
                  text = text.replace(f"'{src}'", dst)
                  text = text.replace(f'"{src}"', dst)
              if text != original:
                  path.write_text(text, encoding='utf-8')

