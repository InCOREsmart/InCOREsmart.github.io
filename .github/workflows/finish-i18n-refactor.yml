              payouts: { totalContracts: 'Всего по контрактам', paid: 'Выплачено', locked: 'Заблокировано', clawback: 'Clawback', noStreams: 'Потоков выплат пока нет', stream: 'Поток', contract: 'Контракт', amount: 'Сумма', status: 'Статус', unlockCondition: 'Условие разблокировки', date: 'Дата', unlockedShort: 'Разб.', paidShort: 'Выпл.', clawbackWarningTitle: 'Предупреждение о clawback', contractNotFound: 'Контракт не найден' },
