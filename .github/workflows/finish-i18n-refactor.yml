name: Finish i18n refactor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refactor hardcoded UI strings
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('src/pages')

          replacements = {
            # Agent contracts
            'Агент не найден': "{t('agent.agentNotFound')}",
            'из {contracts.length} всего': "{t('agent.ofTotal', { count: contracts.length })}",
            'Эскроу': "{t('agent.escrow')}",
            'Защищено смарт-контрактом': "{t('agent.protectedBySmartContract')}",
            'Общая выручка': "{t('agent.totalRevenue')}",
            'По всем контрактам': "{t('agent.allContracts')}",
            'Контрактов пока нет': "{t('agent.noContracts')}",
