verview: 'Şirkətin əsas maliyyə göstəriciləri', cashMovementAugust: 'Avqust üzrə pul hərəkəti', inEscrow: 'Escrow-da', paidInAugust: 'Avqustda ödənilib', pendingPayout: 'Ödəniş gözlənilir', agentPlanAchievement: 'Agentlərin plan icrası', planAchievementDescription: 'Aktiv müqavilələr üzrə plan icrası faizi', critical: 'Kritik', overachieved: 'Planın üstündə', planAchievement: 'Plan icrası' } }
