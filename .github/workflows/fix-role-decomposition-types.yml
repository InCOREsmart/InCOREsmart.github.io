name: Fix RoleDecompositionPage typing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix RoleDecompositionPage typing')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply focused TypeScript fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/ceo/RoleDecompositionPage.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''function normalizeRoleSkills(rows: SavedRoleSkill[]): Array<{ weight: number; is_required?: boolean; skills: SavedSkill | null }> {
            return rows.flatMap(row => {
              if (!row.skills) return [];
              if (Array.isArray(row.skills)) return row.skills.map(skill => ({ ...row, skills: skill }));
              return [row];
            });
          }'''
          new = '''function normalizeRoleSkills(rows: SavedRoleSkill[]): Array<{ weight: number; is_required?: boolean; skills: SavedSkill | null }> {
            return rows.flatMap(row => {
              const skill = row.skills;
              if (!skill) return [];
              if (Array.isArray(skill)) return skill.map(item => ({ ...row, skills: item }));
              return [{ ...row, skills: skill }];
            });
          }'''
          if old not in text:
              raise SystemExit('Expected normalizeRoleSkills block was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify TypeScript
        run: |
          npm ci
          npm run typecheck

      - name: Commit focused fix and remove temporary workflow
        run: |
          git config user.name "InCOREsmart"
          git config user.email "tihonova02@gmail.com"
          rm -f .github/workflows/fix-role-decomposition-types.yml
          git add src/pages/ceo/RoleDecompositionPage.tsx .github/workflows/fix-role-decomposition-types.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix RoleDecompositionPage typing"
          git push origin main
