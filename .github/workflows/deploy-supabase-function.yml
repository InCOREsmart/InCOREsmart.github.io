name: Deploy Supabase Edge Function

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/decompose-role/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-function.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Original tag: actions/checkout@v4
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Original tag: supabase/setup-cli@v1. Pinned to the latest v1 release commit.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: latest

      - name: Deploy decompose-role
        run: supabase functions deploy decompose-role --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: utsuzqmzawunqpiguuhk
