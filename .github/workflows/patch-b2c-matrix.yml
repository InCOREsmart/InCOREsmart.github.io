name: Integrate B2C growth matrix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat: integrate B2C growth matrix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/public/MarketValueCalculatorPage.tsx')
          s=p.read_text()
          imp="import { MarketValueGrowthMatrix } from './MarketValueGrowthMatrix';\n"
          if imp not in s:
              s=s.replace("import { create } from 'zustand';\n", "import { create } from 'zustand';\n"+imp)
          needle="<SkillsChecklist t={t} role={role} setRole={setRole} outcome={outcome} setOutcome={setOutcome} skills={skills} updateSkill={updateSkill} addSkill={()=>setSkills(s=>[...s,{name:'',level:5,criticality:5,evidence:''}])} removeSkill={(i:number)=>setSkills(s=>s.length>1?s.filter((_,idx)=>idx!==i):s)} bottleneck={bottleneck} plan={plan} setPlan={setPlan}/>"
          replacement=needle+"<MarketValueGrowthMatrix lang={lang} role={role} skills={skills} bottleneck={bottleneck}/>"
          if "<MarketValueGrowthMatrix" not in s:
              if needle not in s:
                  raise SystemExit('integration anchor not found')
              s=s.replace(needle,replacement,1)
          p.write_text(s)
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/public/MarketValueCalculatorPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrate B2C growth matrix'
          git push
