name: Deploy HR Calculator

on:
  push:
    branches: ["agent/hr-loss-calculator"]
  workflow_dispatch:

concurrency:
  group: hr-calculator-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Replace HR badge with InCORE logo
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/public/HrLossCalculatorPage.tsx')
          text = path.read_text(encoding='utf-8')
          old = '<div className="mb-3 inline-flex rounded-full bg-indigo-50 px-3 py-1 text-xs font-bold uppercase tracking-wide text-indigo-700">{t(\'hrCalculator.badge\')}</div>'
          if old not in text:
              raise SystemExit('HR calculator badge markup not found')
          text = text.replace(old, '')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build HR Calculator
        run: npm run build -- --base=/hr-calculator/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy HR Calculator
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: hr-calculator
          keep_files: true
