name: One-time B2C routing fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.tsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old="if(window.location.pathname.replace(/\\/$/,'')==='/market-value'){"
          new="if(window.location.pathname.replace(/\\/$/,'')==='/market-value'&&!window.location.hash){"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate
        run: |
          npm ci
          npm run check
          npm run build
      - name: Commit
        run: |
          git config user.name 'InCORE'
          git config user.email 'tihonova02@gmail.com'
          git add src/App.tsx
          git commit -m 'fix: B2C LOGIN FIX app routing' || exit 0
          git push
