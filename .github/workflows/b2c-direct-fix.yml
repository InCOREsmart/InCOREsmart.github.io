name: Direct B2C repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'B2C REPAIR') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove duplicate generated declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/public/MarketValueCalculatorPage.tsx')
          s = p.read_text()
          declaration = "const currencySymbol=(lang:Lang)=>lang==='ru'?'₽':lang==='en'?'$':lang==='kk'?'₸':'₼';"
          first = s.find(declaration)
          if first >= 0:
              second = s.find(declaration, first + len(declaration))
              while second >= 0:
                  s = s[:second] + s[second + len(declaration):]
                  second = s.find(declaration, first + len(declaration))
          p.write_text(s)
          PY
      - name: Validate and build
        run: |
          npm install
          npm run check
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Commit repaired source
        run: |
          git config user.name 'InCORE'
          git config user.email 'tihonova02@gmail.com'
          git add src/pages/public/MarketValueCalculatorPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: B2C REPAIR build'
          git push
