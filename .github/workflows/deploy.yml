name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply payout model synchronization
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/lib/smartContractLogic.ts')
          text = path.read_text(encoding='utf-8')

          if "from './contractFinance'" not in text:
              text = text.replace(
                  "import { supabase } from './supabase';",
                  "import { supabase } from './supabase';\nimport { calculateContractFinancials, getActualContractRevenueBreakdown } from './contractFinance';",
                  1,
              )

          helper = '''

async function syncPayoutStreamAmountsWithActualRevenue(contractId: string) {
  const { data: contract, error: contractError } = await supabase
    .from('contracts')
    .select('actual_contract_revenue, actual_revenue, client_contract_amount, revenue, actual_property_revenue, actual_casco_revenue, actual_dms_revenue, actual_renewal_revenue, actual_cross_sell_revenue, bitrix_deals')
    .eq('id', contractId)
    .maybeSingle();
  if (contractError) throw contractError;
  if (!contract) return;

  const breakdown = getActualContractRevenueBreakdown(contract);
  const actualRevenue = breakdown.property + breakdown.casco + breakdown.dms + breakdown.renewal + breakdown.crossSell;
  if (actualRevenue <= 0) return;

  const finance = calculateContractFinancials(breakdown);
  const amounts: Record<string, number> = {
    new_sales_property: finance.bonusProperty,
    new_sales_casco: finance.bonusCasco,
    new_sales_dms: finance.bonusDms,
    renewal: finance.bonusRenewal,
    cross_sell: finance.bonusCrossSell,
    plan_bonus: finance.bonusPlan,
    retention: finance.bonusRetention,
    annual: finance.bonusAnnual,
  };

  const { data: streams, error: streamsError } = await supabase
    .from('contract_payout_streams')
    .select('id, stream_key, status')
    .eq('contract_id', contractId);
  if (streamsError) throw streamsError;

  const mutableStatuses = ['LOCKED', 'PENDING_VERIFICATION'];
  for (const stream of streams || []) {
    if (!mutableStatuses.includes(stream.status)) continue;
    const amount = amounts[stream.stream_key];
    if (amount === undefined) continue;
    const { error } = await supabase
      .from('contract_payout_streams')
      .update({ amount })
      .eq('id', stream.id);
    if (error) throw error;
  }

  const { data: refreshedStreams, error: refreshedError } = await supabase
    .from('contract_payout_streams')
    .select('stream_key, amount')
    .eq('contract_id', contractId);
  if (refreshedError) throw refreshedError;

  const totalEscrow = (refreshedStreams || [])
    .filter(stream => stream.stream_key !== 'annual')
    .reduce((sum, stream) => sum + Number(stream.amount || 0), 0);

  const { data: escrowEvent, error: escrowLookupError } = await supabase
    .from('escrow_events')
    .select('id, metadata')
    .eq('contract_id', contractId)
    .eq('event_type', 'ESCROW_CREATED')
    .order('created_at', { ascending: true })
    .limit(1)
    .maybeSingle();
  if (escrowLookupError) throw escrowLookupError;

  if (escrowEvent) {
    const metadata = escrowEvent.metadata && typeof escrowEvent.metadata === 'object' ? escrowEvent.metadata : {};
    const { error: escrowUpdateError } = await supabase
      .from('escrow_events')
      .update({
        amount: totalEscrow,
        metadata: {
          ...metadata,
          total_escrow: totalEscrow,
          actual_contract_revenue: actualRevenue,
          actual_revenue_breakdown: breakdown,
          annual_bonus_excluded: true,
          synchronized_with_contract_finance: true,
        },
      })
      .eq('id', escrowEvent.id);
    if (escrowUpdateError) throw escrowUpdateError;
  }
}
'''

          if 'async function syncPayoutStreamAmountsWithActualRevenue' not in text:
              marker = '\nexport async function simulateOracleEvent('
              if marker not in text:
                  raise SystemExit('SYNC_MARKER_NOT_FOUND')
              text = text.replace(marker, helper + marker, 1)

          for fn in ['handleClientPaymentConfirmed', 'handleRenewalConfirmed', 'handleCrossSellConfirmed', 'handlePlanAchieved']:
              marker = f'async function {fn}(contractId: string, userId: string) {{'
              if marker in text:
                  start = text.index(marker)
                  prefix = text[start:start + 500]
                  if 'syncPayoutStreamAmountsWithActualRevenue(contractId);' not in prefix:
                      text = text.replace(marker, marker + '\n  await syncPayoutStreamAmountsWithActualRevenue(contractId);', 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate TypeScript and translations
        run: npm run check

      - name: Build
        run: npm run build

      - name: Commit synchronization changes and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/sync-payout-model.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/smartContractLogic.ts .github/workflows/deploy.yml .github/workflows/sync-payout-model.yml
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            exit 0
          fi
          git commit -m "fix: sync payout streams with actual contract revenue"
          git push

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
