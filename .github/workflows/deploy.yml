name: Deploy to GitHub Pages
on:
  push:
    branches: ["main", "feature/b2c-market-value-calculator"]
  workflow_dispatch:
concurrency:
  group: github-pages-deploy
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm install
      - name: Repair B2C source before validation
        if: github.ref == 'refs/heads/main'
        run: |
          git checkout b432c38f762d5f0cc8efd08b188a96cd3738f36e -- src/pages/public/MarketValueCalculatorPage.tsx
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/pages/public/MarketValueCalculatorPage.tsx')
          s=p.read_text(encoding='utf-8')
          old="const money=(n:number,lang:Lang='ru')=>new Intl.NumberFormat(lang==='ru'?'ru-RU':lang==='en'?'en-US':lang==='kk'?'kk-KZ':'az-AZ',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Math.round(n));"
          new="const money=(n:number,lang:Lang='ru')=>{ const locale=lang==='ru'?'ru-RU':lang==='en'?'en-US':lang==='kk'?'kk-KZ':'az-AZ'; const currency=lang==='ru'?'RUB':lang==='en'?'USD':lang==='kk'?'KZT':'AZN'; return new Intl.NumberFormat(locale,{style:'currency',currency,maximumFractionDigits:0}).format(Math.round(n)); };"
          if old not in s: raise SystemExit('Expected currency function not found')
          s=s.replace(old,new,1)
          for a,b in {"Дofайнер":"Дизайнер","Бofнес":"Бизнес","автоматofировать":"автоматизировать","Автоматofируй":"Автоматизируй","Criticalсть":"Критичность","of твоего":"твоего","of воздуха":"воздуха","Например, 0,48 означает:":"0,48 означает:","For example, 0.48 means:":"0.48 means:","Мысалы, 0,48":"0,48","Məsələn, 0,48":"0,48","2024–2030":"2026–2030","2024-2030":"2026–2030","Заполни хотя бы одну способность, чтобы найти узкое место.":"Заполни от 5 до 7 способностей, чтобы определить узкое место."}.items(): s=s.replace(a,b)
          s=s.replace("gaps:[['skill','Skill Gap','", "gaps:[['skill','Разрыв навыков','",1)
          s=s.replace("['system','System Gap','", "['system','Системный разрыв','",1)
          s=s.replace("['clarity','Clarity Gap','", "['clarity','Разрыв ясности','",1)
          s=s.replace("['capacity','Capacity Gap','", "['capacity','Разрыв мощности','",1)
          s=s.replace("salaryTitle:'Твоя зарплата на руки (₽/мес)'", "salaryTitle:'Твоя зарплата на руки ({currency}/мес)'")
          s=s.replace("salaryTitle:'Your net salary (per month)'", "salaryTitle:'Your net salary ({currency}/month)'")
          s=s.replace("salaryTitle:'Қолыңа алатын жалақы (айына)'", "salaryTitle:'Қолыңа алатын жалақы ({currency}/айына)'")
          s=s.replace("salaryTitle:'Əlinə keçən maaş (aylıq)'", "salaryTitle:'Əlinə keçən maaş ({currency}/aylıq)'")
          s=s.replace("verdictLow:'Тебя недооценивают на 30%+'", "verdictLow:'Создаваемая тобой мощность значительно выше полной стоимости для компании'")
          s=s.replace("verdictLow:'You are undervalued by 30%+'", "verdictLow:'Your created capacity is materially higher than your full company cost'")
          s=s.replace("verdictLow:'Сені 30%+ төмен бағалайды'", "verdictLow:'Сенің жасайтын қуатың компанияның толық шығынынан едәуір жоғары'")
          s=s.replace("verdictLow:'Səni 30%+ aşağı qiymətləndirirlər'", "verdictLow:'Yaratdığın güc şirkət üçün tam xərcindən xeyli yüksəkdir'")
          s=s.replace("planTitle:'План действий на 30 дней'", "planTitle:'План действий на 90 дней'")
          s=s.replace("planTitle:'30-day action plan'", "planTitle:'90-day action plan'")
          s=s.replace("planTitle:'30 күндік әрекет жоспары'", "planTitle:'90 күндік әрекет жоспары'")
          s=s.replace("planTitle:'30 günlük fəaliyyət planı'", "planTitle:'90 günlük fəaliyyət planı'")
          s=s.replace("addSkill={()=>setSkills(s=>[...s,{name:'',level:5,criticality:5,evidence:''}])}", "addSkill={()=>setSkills(s=>s.length<7?[...s,{name:'',level:5,criticality:5,evidence:''}]:s)}")
          s=s.replace("removeSkill={(i:number)=>setSkills(s=>s.length>1?s.filter((_,idx)=>idx!==i):s)}", "removeSkill={(i:number)=>setSkills(s=>s.length>5?s.filter((_,idx)=>idx!==i):s)}")
          s=s.replace("const bottleneck=skills.filter(s=>s.name.trim()).map(s=>({...s,priority:s.level*s.criticality})).filter(s=>s.priority>=50&&s.level<7).sort((a,b)=>b.priority-a.priority)[0];", "const completedSkills=skills.filter(s=>s.name.trim()); const bottleneck=completedSkills.length>=5?completedSkills.map(s=>({...s,priority:s.level*s.criticality})).filter(s=>s.priority>=50&&s.level<7).sort((a,b)=>b.priority-a.priority)[0]:undefined;")
          needle='bottleneck={bottleneck} plan={plan} setPlan={setPlan}/></div><div className="mx-auto mt-5'
          replacement='bottleneck={bottleneck} plan={plan} setPlan={setPlan}/><GrowthMatrix lang={lang} role={role} bottleneck={bottleneck}/></div><div className="mx-auto mt-5'
          if needle not in s: raise SystemExit('B2C render anchor not found')
          s=s.replace(needle,replacement,1)
          imp="import GrowthMatrix from '../../components/b2c/GrowthMatrix';\n"
          if imp not in s: s=s.replace("import { create } from 'zustand';\n", "import { create } from 'zustand';\n"+imp,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/public/MarketValueCalculatorPage.tsx
          if ! git diff --cached --quiet; then git commit -m 'fix: finalize B2C calculator'; git push origin main; fi
      - name: Validate TypeScript
        run: npm run check
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
