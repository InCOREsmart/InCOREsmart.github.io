name: HR Calculator Check

on:
  push:
    branches:
      - "agent/hr-loss-calculator"
  pull_request:
    branches:
      - "main"
    paths:
      - "src/pages/public/HrLossCalculatorPage.tsx"
      - "src/features/hrCalculator/**"
      - "src/i18n/hrCalculatorTranslations.ts"
      - "src/i18n/index.ts"
      - "src/i18n/locales/**"
      - "scripts/check-hr-calculator-i18n.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hr-calculator-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check HR Calculator i18n
        run: node scripts/check-hr-calculator-i18n.mjs

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
