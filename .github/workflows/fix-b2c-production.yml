name: Fix B2C calculator
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'fix: b2c calculator production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Patch B2C
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/pages/public/MarketValueCalculatorPage.tsx')
          s=p.read_text()
          if "const currencySymbol=" not in s:
              marker="const money=(n:number,lang:Lang='ru')=>"
              idx=s.find(marker)
              if idx<0: raise SystemExit('money function marker not found')
              end=s.find(";\n", idx)+2
              s=s[:end]+"const currencySymbol=(lang:Lang)=>lang==='ru'?'₽':lang==='en'?'$':lang==='kk'?'₸':'₼';\n"+s[end:]
          s=s.replace("{t.salaryTitle}", "{t.salaryTitle.replace('{currency}', currencySymbol(lang))}")
          s=s.replace("ratioHint:'0,48 означает: полная стоимость для компании составляет 48% от рассчитанной рыночной мощности. Чем ниже показатель, тем больше разрыв в пользу создаваемой мощности.'", "ratioHint:'{ratio} означает: полная стоимость для компании составляет {percent}% от рассчитанной рыночной мощности. Чем ниже показатель, тем больше разрыв в пользу создаваемой мощности.'")
          p.write_text(s)
          PY
          cat > src/components/b2c/GrowthMatrix.tsx <<'TSX'
          import React, { useMemo, useState } from 'react';
          type Lang='ru'|'en'|'kk'|'az'; type Props={lang:Lang;role:string;bottleneck?:{name:string}}; type Item=Record<Lang,string>;
          const copy={
            ru:{title:'Матрица обесценивания и роста навыков 2026–2030',intro:'Сравни свои навыки с теми, которые дешевеют, растут в цене и только появляются.',red:'Падает в цене',green:'Растёт в цене',blue:'Появляется',choose:'Выбери направление',why:'Почему это важно',action:'Что делать',plan:'Твой план на 90 дней',empty:'Заполни от 5 до 7 способностей, чтобы определить главное узкое место.',d1:'Дни 1–30: определить критерий результата и получить первое доказательство.',d2:'Дни 31–60: применить навык минимум в пяти реальных задачах и измерить изменение результата.',d3:'Дни 61–90: собрать доказательства результата и повторить расчёт рыночной мощности.'},
            en:{title:'Skill value and growth matrix 2026–2030',intro:'Compare your skills with those losing value, gaining value and emerging.',red:'Declining in value',green:'Growing in value',blue:'Emerging',choose:'Choose a direction',why:'Why it matters',action:'What to do',plan:'Your 90-day plan',empty:'Complete 5–7 capabilities to identify your main bottleneck.',d1:'Days 1–30: define the result criterion and obtain your first proof.',d2:'Days 31–60: apply the skill in at least five real tasks and measure the change.',d3:'Days 61–90: collect proof of results and recalculate your market capacity.'},
            kk:{title:'Дағдылардың құнсыздануы мен өсу матрицасы 2026–2030',intro:'Құны төмендейтін, өсетін және пайда болатын дағдыларыңды салыстыр.',red:'Құны төмендейді',green:'Құны өседі',blue:'Пайда болады',choose:'Бағытты таңда',why:'Неліктен бұл маңызды',action:'Не істеу керек',plan:'90 күндік жоспарың',empty:'Негізгі тар орынды анықтау үшін 5–7 қабілетті толтыр.',d1:'1–30 күн: нәтиже өлшемін анықтап, алғашқы дәлелді ал.',d2:'31–60 күн: дағдыны кемінде бес нақты міндетте қолданып, өзгерісті өлше.',d3:'61–90 күн: нәтиже дәлелдерін жинап, нарықтық қуатты қайта есепте.'},
            az:{title:'Bacarıqların dəyər itirməsi və artımı matrisi 2026–2030',intro:'Dəyəri azalan, artan və yeni yaranan bacarıqlarını müqayisə et.',red:'Dəyəri azalır',green:'Dəyəri artır',blue:'Yaranır',choose:'İstiqamət seç',why:'Niyə bu vacibdir',action:'Nə etməli',plan:'90 günlük planın',empty:'Əsas darboğazı müəyyən etmək üçün 5–7 bacarıq doldur.',d1:'1–30 gün: nəticə meyarını müəyyən et və ilk sübutunu əldə et.',d2:'31–60 gün: bacarığı ən azı beş real tapşırıqda tətbiq et və dəyişikliyi ölç.',d3:'61–90 gün: nəticə sübutlarını topla və bazar gücünü yenidən hesabla.'}
          } as const;
          const I=(ru:string,en:string,kk:string,az:string):Item=>({ru,en,kk,az});
          const data={
            sales:{red:I('Холодные звонки по скрипту, базовая квалификация лида, механическое заполнение CRM, шаблонные КП.','Scripted cold calls, basic lead qualification, mechanical CRM entry and template proposals.','Скрипт бойынша суық қоңыраулар, бастапқы лид біліктілігі, CRM-ді механикалық толтыру және шаблондық ұсыныстар.','Skript üzrə soyuq zənglər, ilkin lead kvalifikasiyası, CRM-in mexaniki doldurulması və şablon təkliflər.'),green:I('Выявление скрытых экономических потребностей, сложные переговоры с несколькими ЛПР, удержание маржинальности.','Hidden economic needs, complex negotiations with multiple decision-makers and margin protection.','Жасырын экономикалық қажеттіліктер, бірнеше шешім қабылдаушымен күрделі келіссөздер және маржаны қорғау.','Gizli iqtisadi ehtiyacların aşkarlanması, bir neçə qərarverənlə mürəkkəb danışıqlar və marjanın qorunması.'),blue:I('Управление гибридной воронкой человек + AI, персонализация предложений, прогноз оттока по данным CRM.','Human + AI funnel management, personalized proposals and CRM-based churn prediction.','Адам + AI воронкасын басқару, ұсыныстарды дербестендіру және CRM деректері бойынша кетуді болжау.','İnsan + AI hunisinin idarə edilməsi, təkliflərin fərdiləşdirilməsi və CRM məlumatları ilə itki proqnozu.')},
            marketing:{red:I('Ручной таргетинг, SEO-тексты «для галочки», базовый дизайн и механический постинг.','Manual targeting, checkbox SEO copy, basic design and mechanical posting.','Қолмен таргеттеу, формалды SEO мәтіндері, базалық дизайн және механикалық жариялау.','Manual hədəfləmə, formal SEO mətnləri, əsas dizayn və mexaniki paylaşım.'),green:I('Юнит-экономика, глубокие интервью с клиентами, репутация и кросс-функциональная стратегия.','Unit economics, deep customer research, reputation and cross-functional strategy.','Unit-экономика, терең клиенттік зерттеу, бедел және кросс-функционалды стратегия.','Unit iqtisadiyyatı, dərin müştəri araşdırması, reputasiya və funksiyalararası strategiya.'),blue:I('Управление AI-агентами, first-party данные и интерактивный контент.','AI-agent orchestration, first-party data and interactive content.','AI-агенттерін басқару, first-party деректері және интерактивті контент.','AI agentlərinin idarə edilməsi, first-party məlumatları və interaktiv kontent.')},
            it:{red:I('Шаблонный код, ручное тестирование, базовая вёрстка и простые дашборды.','Boilerplate code, manual testing, basic layouts and simple dashboards.','Шаблондық код, қолмен тестілеу, базалық беттеу және қарапайым дашбордтар.','Şablon kod, manual test, əsas layout və sadə dashboardlar.'),green:I('Архитектура, понимание бизнес-домена, безопасность, производительность и техдолг.','Architecture, business-domain expertise, security, performance and technical debt.','Архитектура, бизнес-доменді түсіну, қауіпсіздік, өнімділік және техникалық қарыз.','Arxitektura, biznes domeni, təhlükəsizlik, performans və texniki borc.'),blue:I('AI-оркестрация, проверка AI-результатов и MLOps.','AI orchestration, AI-output validation and MLOps.','AI-оркестрациясы, AI нәтижелерін тексеру және MLOps.','AI orkestrasiya, AI nəticələrinin yoxlanması və MLOps.')},
            hr:{red:I('Массовый скрининг резюме, первичные интервью, документы и рутинная координация.','Mass CV screening, first interviews, paperwork and routine coordination.','Резюмелерді жаппай скринингтеу, алғашқы сұхбаттар, құжаттар және күнделікті үйлестіру.','Kütləvi CV skrininqi, ilkin müsahibələr, sənədləşmə və rutin koordinasiya.'),green:I('Проектирование ролей, производительная мощность команд, внутренняя мобильность и удержание.','Role design, productive team capacity, internal mobility and retention.','Рөлдерді жобалау, команданың өнімді қуаты, ішкі мобильдік және ұстап қалу.','Rolların dizaynı, komandanın məhsuldar gücü, daxili mobillik və saxlanma.'),blue:I('Алгоритмическая справедливость, предиктивная аналитика текучести и рабочие места человек + AI.','Algorithmic fairness, predictive attrition analytics and human + AI job design.','Алгоритмдік әділдік, кетуді болжау аналитикасы және адам + AI жұмыс орындарын жобалау.','Alqoritmik ədalət, işçi dövriyyəsinin proqnoz analitikası və insan + AI iş yerlərinin dizaynı.')},
            finance:{red:I('Ручной ввод документов, сведение таблиц и бюджетирование «от достигнутого».','Manual document entry, spreadsheet consolidation and incremental budgeting.','Құжаттарды қолмен енгізу, кестелерді біріктіру және өткенге сүйенген бюджеттеу.','Sənədlərin əl ilə daxil edilməsi, cədvəllərin birləşdirilməsi və keçmişə əsaslanan büdcələmə.'),green:I('Сценарное моделирование, управление денежным потоком и ROI людей и технологий.','Scenario modelling, cash-flow decisions and ROI of people and technology.','Сценарийлік модельдеу, ақша ағынын басқару және адамдар мен технологиялардың ROI.','Ssenari modelləşdirməsi, pul axınının idarəsi və insan və texnologiyaların ROI-si.'),blue:I('Аудит алгоритмических финансовых решений, токенизированные активы и ESG.','Algorithmic finance audit, tokenized assets and ESG-finance integration.','Алгоритмдік қаржылық шешімдер аудиті, токенделген активтер және ESG.','Alqoritmik maliyyə qərarlarının auditi, tokenləşdirilmiş aktivlər və ESG.')}
          } as const;
          export default function GrowthMatrix({lang,role,bottleneck}:Props){
            const t=copy[lang]; const [selected,setSelected]=useState<'red'|'green'|'blue'>('green');
            const r=role.toLowerCase(); const key=useMemo(()=>r.match(/продаж|sales|сату|satış/)?'sales':r.match(/маркет|market/)?'marketing':r.match(/разраб|developer|it|әзір|inkişaf/)?'it':r.match(/hr|персон|адам|insan/)?'hr':r.match(/финанс|finance|қаржы|maliyy/)?'finance':'sales',[r]);
            const why={red:{ru:'Рутину всё чаще выполняют AI и автоматизация. Её ценность снижается, если она не связана с ответственностью за результат.',en:'AI and automation increasingly perform routine work. Its value falls when it is not tied to outcome ownership.',kk:'AI мен автоматтандыру күнделікті жұмысты көбірек орындайды. Нәтижеге жауапкершілікпен байланыспаса, оның құны төмендейді.',az:'AI və avtomatlaşdırma rutin işi getdikcə daha çox yerinə yetirir. Nəticəyə məsuliyyətlə bağlanmadıqda dəyəri azalır.'},green:{ru:'Эти навыки напрямую влияют на деньги, сложные решения и ответственность за результат.',en:'These skills directly affect money, complex decisions and outcome ownership.',kk:'Бұл дағдылар ақшаға, күрделі шешімдерге және нәтижеге жауапкершілікке тікелей әсер етеді.',az:'Bu bacarıqlar pula, mürəkkəb qərarlara və nəticəyə görə məsuliyyətə birbaşa təsir edir.'},blue:{ru:'Компании только строят связку человек + AI, поэтому растёт спрос на тех, кто умеет превращать AI в измеримый результат.',en:'Companies are still building human + AI workflows, increasing demand for people who turn AI into measurable outcomes.',kk:'Компаниялар адам + AI жұмысын енді қалыптастырып жатыр, сондықтан AI-ды өлшенетін нәтижеге айналдыратын мамандар қажет.',az:'Şirkətlər insan + AI iş axınlarını yenicə qurur, buna görə AI-ni ölçülə bilən nəticəyə çevirən mütəxəssislərə tələbat artır.'}};
            const action={red:{ru:'Автоматизируй рутину и освободи время для задач, где нужен контекст и ответственность.',en:'Automate routine work and free time for tasks requiring context and ownership.',kk:'Күнделікті жұмысты автоматтандырып, контекст пен жауапкершілікті қажет ететін міндеттерге уақыт босат.',az:'Rutini avtomatlaşdır və kontekst və məsuliyyət tələb edən işlərə vaxt ayır.'},green:{ru:'Прокачивай финансовую грамотность, переговоры и способность доказывать экономический результат.',en:'Strengthen financial literacy, negotiation and your ability to prove economic outcomes.',kk:'Қаржылық сауаттылықты, келіссөздерді және экономикалық нәтижені дәлелдеу қабілетін дамыт.',az:'Maliyyə savadlılığını, danışıqları və iqtisadi nəticəni sübut etmək bacarığını inkişaf etdir.'},blue:{ru:'Освой аналитику данных и постановку задач AI, затем собери первое доказательство результата.',en:'Learn data analysis and AI task design, then produce your first proof of outcome.',kk:'Деректер талдауын және AI-ға тапсырма қоюды меңгеріп, алғашқы нәтиже дәлелін жаса.',az:'Data analitikasını və AI üçün tapşırıq qoymağı öyrən, sonra ilk nəticə sübutunu yarat.'}};
            return <section className="mt-6 rounded-2xl border border-slate-200 p-5 sm:p-7"><h2 className="text-2xl font-bold">{t.title}</h2><p className="mt-2 leading-7 text-slate-600">{t.intro}</p><div className="mt-5 grid gap-3 md:grid-cols-3">{(['red','green','blue'] as const).map(k=><button key={k} type="button" onClick={()=>setSelected(k)} aria-pressed={selected===k} className={`rounded-xl border p-4 text-left transition ${selected===k?'border-slate-900 bg-slate-50':'border-slate-200 hover:border-slate-400'}`}><div className="font-bold">{t[k]}</div><p className="mt-2 text-sm leading-6 text-slate-600">{data[key][k][lang]}</p></button>)}</div><div className="mt-5 rounded-xl bg-slate-50 p-5"><div className="font-semibold">{t.choose}: {t[selected]}</div><div className="mt-4"><div className="text-sm font-semibold">{t.why}</div><p className="mt-1 text-sm leading-6 text-slate-600">{why[selected][lang]}</p></div><div className="mt-4"><div className="text-sm font-semibold">{t.action}</div><p className="mt-1 text-sm leading-6 text-slate-600">{action[selected][lang]}</p></div></div><div className="mt-5 rounded-xl border border-slate-200 p-5"><div className="font-semibold">{t.plan}</div><p className="mt-2 text-sm text-slate-600">{bottleneck?.name?bottleneck.name:t.empty}</p><ol className="mt-3 list-decimal space-y-2 pl-5 text-sm text-slate-600"><li>{t.d1}</li><li>{t.d2}</li><li>{t.d3}</li></ol></div></section>;
          }
          TSX
      - name: Validate
        run: |
          npm install
          npm run check
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/public/MarketValueCalculatorPage.tsx src/components/b2c/GrowthMatrix.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: b2c calculator production'
          git push
