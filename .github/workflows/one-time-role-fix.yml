name: One-time role typing fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair translation map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/i18n/featureTranslations.ts')
          text = path.read_text(encoding='utf-8')
          duplicate = "'Декомпозиция роли': 'Рөлді декомпозициялау', 'Декомпозиция роли': 'Рөлді декомпозициялау',"
          fixed = "'Декомпозиция роли': 'Рөлді декомпозициялау',"
          if duplicate in text:
              text = text.replace(duplicate, fixed, 1)
              path.write_text(text, encoding='utf-8')
              print('Removed duplicate translation key in kk.legacyUi.')
          else:
              print('Duplicate translation key already absent.')
          PY

      - name: Verify TypeScript
        run: |
          npm ci
          npm run typecheck

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "InCOREsmart"
          git config user.email "tihonova02@gmail.com"
          rm -f .github/workflows/one-time-role-fix.yml
          git add src/i18n/featureTranslations.ts .github/workflows/one-time-role-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: remove duplicate i18n translation key"
            git push origin main
          fi
