name: One-time role typing fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply focused fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/ceo/RoleDecompositionPage.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''function normalizeRoleSkills(rows: SavedRoleSkill[]): Array<{ weight: number; is_required?: boolean; skills: SavedSkill | null }> {
            return rows.flatMap(row => {
              if (!row.skills) return [];
              if (Array.isArray(row.skills)) return row.skills.map(skill => ({ ...row, skills: skill }));
              return [row];
            });
          }'''
          new = '''function normalizeRoleSkills(rows: SavedRoleSkill[]): Array<{ weight: number; is_required?: boolean; skills: SavedSkill | null }> {
            return rows.flatMap(row => {
              const skill = row.skills;
              if (!skill) return [];
              if (Array.isArray(skill)) return skill.map(item => ({ ...row, skills: item }));
              return [{ ...row, skills: skill }];
            });
          }'''
          if old not in text:
              raise SystemExit('Expected block not found; no changes made.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify TypeScript
        run: |
          npm ci
          npm run typecheck
      - name: Commit fix and remove temporary workflows
        run: |
          git config user.name "InCOREsmart"
          git config user.email "tihonova02@gmail.com"
          rm -f .github/workflows/one-time-role-fix.yml .github/workflows/fix-role-decomposition-types.yml
          git add src/pages/ceo/RoleDecompositionPage.tsx .github/workflows/one-time-role-fix.yml .github/workflows/fix-role-decomposition-types.yml
          git commit -m "Apply role decomposition typing fix"
          git push origin main
