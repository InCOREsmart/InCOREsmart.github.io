name: Normalize B2C localization
on:
  push:
    paths:
      - '.github/workflows/normalize-b2c.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix B2C localization and currency
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/pages/public/MarketValueCalculatorPage.tsx')
          s=p.read_text()
          s=s.replace("const money=(n:number,lang:Lang='ru')=>new Intl.NumberFormat(lang==='ru'?'ru-RU':lang==='en'?'en-US':lang==='kk'?'kk-KZ':'az-AZ',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Math.round(n));", "const money=(n:number,lang:Lang='ru')=>{ const locale=lang==='ru'?'ru-RU':lang==='en'?'en-US':lang==='kk'?'kk-KZ':'az-AZ'; const currency=lang==='ru'?'RUB':lang==='en'?'USD':lang==='kk'?'KZT':'AZN'; return new Intl.NumberFormat(locale,{style:'currency',currency,maximumFractionDigits:0}).format(Math.round(n)); };\nconst currencyLabel=(lang:Lang)=>lang==='ru'?'₽':lang==='en'?'$':lang==='kk'?'₸':'₼';")
          blocks={}
          for lang in ('ru','en','kk','az'):
              start=s.find(f" {lang}:{{")
              if start<0: continue
              nxt=min([x for x in [s.find(f" {x}:{{",start+1) for x in ('ru','en','kk','az')] if x>=0] or [len(s)])
              blocks[lang]=(start,nxt,s[start:nxt])
          repl={
            'ru': {'Skill Gap':'Разрыв навыков','System Gap':'Системный разрыв','Clarity Gap':'Разрыв ясности','Capacity Gap':'Разрыв мощности','Priority':'Приоритет','Evidence of Work':'Доказательство результата','High':'Высокий','Market':'Рынок','Delete':'Удалить','of твоего':'твоего','of воздуха':'воздуха','Criticalсть':'Критичность','Автоматofируй':'Автоматизируй','автоматofировать':'автоматизировать','Дofайнер':'Дизайнер','Бofнес':'Бизнес','Тебя недооценивают на 30%+':'Создаваемая тобой мощность значительно выше полной стоимости для компании','Заполни хотя бы одну способность, чтобы найти узкое место.':'Заполни от 5 до 7 способностей, чтобы определить узкое место.','Например: выявлять скрытые потребности клиента':'Выявлять скрытые потребности клиента','Например, 0,48 означает:':'0,48 означает:'},
            'en': {'Skill Gap':'Skill gap','System Gap':'System gap','Clarity Gap':'Clarity gap','Capacity Gap':'Capacity gap','Priority':'Priority','Evidence of Work':'Evidence of results','High':'High','Market':'Market','Delete':'Delete','Criticalсть':'Criticality','Автоматofируй':'Automate','автоматofировать':'automate','Дofайнер':'Designer','Бofнес':'Business','Заполни хотя бы одну способность, чтобы найти узкое место.':'Complete 5–7 abilities to identify your bottleneck.','Например, 0,48 означает:':'0.48 means:'},
            'kk': {'Skill Gap':'Дағды алшақтығы','System Gap':'Жүйелік алшақтық','Clarity Gap':'Айқындық алшақтығы','Capacity Gap':'Қуат алшақтығы','Priority':'Басымдық','Evidence of Work':'Нәтиже дәлелі','High':'Жоғары','Market':'Нарық','Delete':'Жою','Criticalсть':'Маңыздылық','Автоматofируй':'Автоматтандыр','автоматofировать':'автоматтандыру','Дofайнер':'Дизайнер','Бofнес':'Бизнес','Заполни хотя бы одну способность, чтобы найти узкое место.':'Тар жерді анықтау үшін 5–7 қабілет толтырыңыз.','Например, 0,48 означает:':'0,48 дегеніміз:'},
            'az': {'Skill Gap':'Bacarıq boşluğu','System Gap':'Sistem boşluğu','Clarity Gap':'Aydınlıq boşluğu','Capacity Gap':'Güc boşluğu','Priority':'Prioritet','Evidence of Work':'Nəticənin sübutu','High':'Yüksək','Market':'Bazar','Delete':'Sil','Criticalсть':'Kritiklik','Автоматofируй':'Avtomatlaşdır','автоматofировать':'avtomatlaşdırmaq','Дofайнер':'Dizayner','Бofнес':'Biznes','Заполни хотя бы одну способность, чтобы найти узкое место.':'Darboğazı müəyyən etmək üçün 5–7 bacarıq doldurun.','Например, 0,48 означает:':'0,48 o deməkdir:'}
          }
          for lang,(a,b,block) in blocks.items():
              for old,new in repl[lang].items(): block=block.replace(old,new)
              s=s[:a]+block+s[b:]
          s=s.replace("salaryTitle:'Твоя зарплата на руки (₽/мес)'", "salaryTitle:'Твоя зарплата на руки ({currency}/мес)'")
          s=s.replace("salaryTitle:'Your net salary (per month)'", "salaryTitle:'Your net salary ({currency}/month)'")
          p.write_text(s)
          PY
      - name: Commit normalized B2C
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/public/MarketValueCalculatorPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: complete B2C localization and currency'
          git push
