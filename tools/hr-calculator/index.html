<h1>Сколько бизнес теряет из-за сотрудников?</h1>
<p>Калькулятор оценивает не только прямые расходы на сотрудника, а финансовый разрыв из-за текучести, найма и периода выхода на результат.</p>
<h2>Что можно посчитать</h2>
<ul><li>стоимость замещения сотрудника;</li><li>стоимость текучести;</li><li>недополученный результат в период адаптации;</li><li>затраты HR на поиск и замену;</li><li>потенциально возвращаемый эффект при снижении потерь.</li></ul>
<h2>Как читать результат</h2>
<p>Прямые расходы и недополученный экономический эффект не следует автоматически складывать: это разные типы показателей. Расчёт зависит от исходных данных и допущений компании.</p>
