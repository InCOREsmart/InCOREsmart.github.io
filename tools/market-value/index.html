<h1>Сколько я стою на рынке труда?</h1>
<p><strong>Короткий ответ:</strong> одной фиксированной рыночной цены нет. Диапазон зависит от роли, уровня, региона, формата работы, навыков, подтверждённых результатов и бюджета работодателя.</p>
<h2>Что оценивает калькулятор</h2>
<ul><li>текущий доход;</li><li>экономический эффект работы;</li><li>устойчивость результата;</li><li>редкость навыков и их устойчивость к изменениям рынка и AI;</li><li>разрыв между текущим доходом и создаваемым эффектом.</li></ul>
<h2>Как использовать результат</h2>
<p>Используйте расчёт как рабочую модель для подготовки к поиску работы, переговорам о зарплате или пересмотру дохода. Он не заменяет актуальные зарплатные обзоры, вакансии и данные по конкретной роли.</p>
<h2>Как считается</h2>
<p>Сначала фиксируются роль и уровень, затем навыки и подтверждённые результаты. После этого оцениваются экономический вклад, устойчивость результата и рыночный контекст. Итог следует воспринимать как диапазон, а не как «цену человека».</p>
