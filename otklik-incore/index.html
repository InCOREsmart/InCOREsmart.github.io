function candidateDetails(c){showModal(esc(c.name),'<div class="candidate-top"><div class="person">'+esc(c.initials)+'</div><div><h4>'+esc(c.title)+'</h4><p>'+esc(c.salary)+'</p></div></div><p><b>Навыки:</b> '+esc(c.skills)+'</p><div class="notice">Совпадение с критериями вакансии: '+c.match+'%. Демонстрационный профиль.</div>','Пригласить',()=>{closeModal();invite(c)})}
function invite(c){showModal("Пригласить кандидата",'<p>Приглашение для <b>'+esc(c.name)+'</b>.</p><div class="field"><label>Дата</label><input id="ivDate" type="date" value="'+new Date(Date.now()+86400000).toISOString().slice(0,10)+'"></div><div class="field"><label>Время</label><select id="ivTime"><option>10:00</option><option>11:30</option><option>13:00</option><option>15:00</option><option>16:30</option></select></div><div class="field"><label>Формат встречи</label><select id="ivKind"><option>Онлайн</option><option>Очно</option></select></div><div class="notice">Демо: приглашение будет записано в этом браузере, но кандидату не отправится.</div>','Создать приглашение',()=>{let date=$("#ivDate").value,time=$("#ivTime").value,kind=$("#ivKind").value;interviews.push({title:c.name,company:"Вакансия работодателя",date,time,kind});applications.push({id:Date.now(),title:c.title,company:"Работодатель",salary:c.salary,mark:c.initials,status:"Приглашение",date});persist();closeModal();toast("Приглашение добавлено в демо-календарь");setPage("interviews")})}
function openDeal(){showModal("Новая сделка InCORE",'<div class="field"><label>Рабочая задача *</label><input id="dTitle" placeholder="Например, разобрать воронку продаж" required></div><div class="formgrid"><div class="field"><label>Кандидат</label><select id="dCandidate">'+candidates.map(c=>'<option>'+esc(c.name)+'</option>').join("")+'</select></div><div class="field"><label>Часы, максимум 48</label><input id="dHours" type="number" min="1" max="48" value="8" required></div><div class="field"><label>Ставка, ₽/час</label><input id="dRate" type="number" min="1" value="1500" required></div><div class="field"><label>Критерий результата</label><input id="dCriteria" placeholder="Как принимаем результат"></div></div><div class="notice">Бюджет рабочего цикла рассчитывается по часам и ставке. Это локальная демонстрация: деньги не резервируются и не переводятся.</div><div class="metric"><small>Расчётный бюджет</small><b id="dTotal">12 000 ₽</b></div>','Создать демо-сделку',()=>{let title=$("#dTitle").value.trim(),candidate=$("#dCandidate").value,hours=Math.min(48,Math.max(1,Number($("#dHours").value)||1)),rate=Math.max(1,Number($("#dRate").value)||1500),criteria=$("#dCriteria").value.trim();if(!title){toast("Укажи рабочую задачу");return}deals.push({title,candidate,hours,amount:hours*rate,criteria,status:"Черновик"});persist();closeModal();toast("Демо-сделка сохранена. Оплата не производилась.");render()});["dHours","dRate"].forEach(id=>$("#"+id).addEventListener("input",()=>{$("#dTotal").textContent=((Math.min(48,Math.max(1,Number($("#dHours").value)||1)))*(Math.max(1,Number($("#dRate").value)||1500))).toLocaleString("ru-RU")+" ₽"}))}
$$("[data-page]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
$("#modalBack").addEventListener("click",e=>{if(e.target===$("#modalBack"))closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(page==="feed"&&e.key==="ArrowRight")$("#like")?.click();if(page==="feed"&&e.key==="ArrowLeft")$("#skip")?.click()});
$("#rolePill").style.cursor="pointer";$("#rolePill").title="Переключить режим";$("#rolePill").addEventListener("click",()=>{role=role==="candidate"?"employer":"candidate";setPage(role==="candidate"?"feed":"employer")});
render();
</script></body></html>
