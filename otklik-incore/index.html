s_at:startsAt,mode:kind,location_or_link:$("#ivLink").value.trim()||null,notes:$("#ivNotes").value.trim()||null,status:"proposed"}).select("*").single();if(error){toast("Не удалось создать приглашение: "+error.message);return}closeModal();await otklikLoadData();toast("Приглашение отправлено в кабинет кандидата");setPage("interviews")})}

      otklikUser=res.data.user;
      if(mode==="signup"){
        const newRole=$("#otRole").value;
        const {error}=await otklikDb.from("inc_app_profiles").upsert({id:otklikUser.id,role:newRole,full_name:$("#otName").value.trim()||email.split("@")[0],visibility:newRole==="candidate"&&$("#otVisible").checked?"discoverable":"private"},{onConflict:"id"});
        if(error)throw error;
      }

    const meta=otklikUser.user_metadata||{};const initialRole=meta.requested_role==="employer"?"employer":"candidate";const {error:insertError}=await otklikDb.from("inc_app_profiles").insert({id:otklikUser.id,role:initialRole,full_name:meta.full_name||otklikUser.email.split("@")[0],visibility:initialRole==="candidate"&&meta.discoverable?"discoverable":"private"});

    return otklikLoadProfile();
  }
  otklikProfile=data;role=data.role;

      jobs=vac.map(v=>({id:v.id,company:profs[v.employer_id]?.headline||profs[v.employer_id]?.full_name||"Работодатель",mark:(profs[v.employer_id]?.full_name||"О")[0],title:v.title,salary:v.salary_min||v.salary_max?((v.salary_min?Number(v.salary_min).toLocaleString("ru-RU")+" ₽":"")+(v.salary_min&&v.salary_max?"–":"")+(v.salary_max?Number(v.salary_max).toLocaleString("ru-RU")+" ₽":"")):"По договорённости",city:v.city||v.work_format||"Не указан",type:({full_time:"Полная занятость",part_time:"Частичная занятость",project:"Проектная работа",internship:"Стажировка"})[v.employment_type]||v.employment_type,exp:v.experience_level||"Не указан",schedule:v.schedule||"По договорённости",desc:v.description,skills:v.skills||[],match:0,color:"linear-gradient(130deg,#e3e8ff,#e1f8ef)",deal:true,expectedOutcome:v.expected_outcome,employer_id:v.employer_id}));

      const {data:people,error:ce}=await otklikDb.from("inc_app_profiles").select("id,full_name,headline,skills,salary_expectation,visibility").eq("role","candidate").eq("visibility","discoverable");

async function advance(action,j,fromSaved=false){
  if(!j)return;
  if(action==="like"){
    if(!applications.some(a=>a.id===j.id)){
      if(otklikUser&&role==="candidate"&&typeof j.id==="string"){
        const {error}=await otklikDb.from("inc_applications").insert({vacancy_id:j.id,candidate_id:otklikUser.id,status:"applied"});
        if(error){toast("Отклик не отправлен: "+error.message);return}
      }
      applications.push({id:j.id,title:j.title,company:j.company,salary:j.salary,mark:j.mark,status:"Отклик отправлен",date:new Date().toLocaleDateString("ru-RU")});
      store.set("applications",applications);$("#navCount").textContent=applications.length;
      toast(otklikUser&&typeof j.id==="string"?"Отклик отправлен работодателю":"Отклик сохранён в этом браузере. Войдите для отправки на сервер.");
    }else toast("Ты уже откликнулась на эту вакансию");
  }
  index++;if(fromSaved)index=0;render();
}

  const form=e.target;
  if(form.id==="profileForm"&&otklikUser){
    e.preventDefault();e.stopImmediatePropagation();
    const o=Object.fromEntries(new FormData(form));const existing=otklikProfile||{};
    const payload={id:otklikUser.id,role,full_name:o.name,headline:o.title,city:o.city||null,salary_expectation:o.salary?Number(o.salary):null,skills:(o.skills||"").split(",").map(s=>s.trim()).filter(Boolean),bio:o.about||null,visibility:existing.visibility||"private"};
    const {data,error}=await otklikDb.from("inc_app_profiles").upsert(payload,{onConflict:"id"}).select("*").single();
    if(error){toast("Профиль не сохранён: "+error.message);return}
    otklikProfile=data;store.set("profile",o);toast("Профиль сохранён в общей базе");
  }
  if(form.id==="jobForm"&&otklikUser&&role==="employer"){
    e.preventDefault();e.stopImmediatePropagation();
    const o=Object.fromEntries(new FormData(form));const nums=(o.salary.match(/[0-9][0-9\s]*/g)||[]).map(s=>Number(s.replace(/\s/g,""))).filter(Number.isFinite);
    const types={"Полная занятость":"full_time","Частичная занятость":"part_time","Проектная работа":"project","Стажировка":"internship"};
    const {data,error}=await otklikDb.from("inc_app_vacancies").insert({employer_id:otklikUser.id,title:o.title,description:o.desc,expected_outcome:o.desc,skills:(o.skills||"").split(",").map(s=>s.trim()).filter(Boolean),salary_min:nums[0]||null,salary_max:nums[1]||nums[0]||null,city:o.city,work_format:o.city,employment_type:types[o.type]||"full_time",schedule:o.type,experience_level:o.exp||"any",status:"published"}).select("*").single();
    if(error){toast("Вакансия не опубликована: "+error.message);return}
    posted.unshift({id:data.id,title:data.title,company:o.company,salary:o.salary,city:o.city,mark:(o.company||"В")[0],status:"published"});store.set("posted",posted);toast("Вакансия опубликована в общей базе");setPage("employer");
  }
},true);
document.addEventListener("DOMContentLoaded",()=>{});
(async()=>{
  const {data}=await otklikDb.auth.getSession();otklikUser=data.session?.user||null;
  if(otklikUser){try{await otklikLoadProfile();await otklikLoadData()}catch(err){console.error(err);toast("Ошибка загрузки данных: "+err.message)}}
  otklikRefreshHeader();render();
  otklikDb.auth.onAuthStateChange((_event,session)=>{otklikUser=session?.user||null;if(!otklikUser){otklikProfile=null;otklikRefreshHeader()}});
})();
</script></body></html>
