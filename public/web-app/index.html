mall>'+money(s.goal.salary)+' в месяц</small></div></div></div></div>'}
function vacancyList(){return '<div class="list">'+vacancies.map(function(v){var applied=s.swipes.some(function(x){return x.role==='candidate'&&x.id===v.id&&x.type==='like'}),verified=!!s.skillChecks[v.roleKey];return '<div class="list-row"><div class="mini">'+v.id+'</div><div class="grow"><strong>'+v.title+'</strong><small>'+v.company+' · '+v.pay+'</small><small>'+v.hours+' · '+(verified?'Навыки проверены':'Нужна первичная проверка')+'</small></div><button class="btn '+(applied?'light':'outline')+'" data-vacancy="'+v.id+'" '+(applied||!verified?'disabled':'')+'>'+(applied?'Отклик отправлен':verified?'Откликнуться':'Сначала проверка')+'</button></div><p class="hint" style="padding:0 0 10px 47px;margin:0">'+v.desc+'</p>'}).join('')+'</div>'}
function breakdown(h){var base=h*1500,fee=Math.round(base*.12);return '<div class="pricebox"><div class="priceline"><span>Работа кандидата</span><strong>'+money(base)+'</strong></div><div class="priceline"><span>Комиссия InCORE · 12%</span><strong>'+money(fee)+'</strong></div><div class="priceline"><span>Длительность</span><strong>'+h+' ч</strong></div><div class="priceline"><span>Ставка</span><strong>1 500 ₽/ч</strong></div><div class="priceline total"><span>Общая сумма</span><strong>'+money(base+fee)+'</strong></div></div>'}
function dealsPage(){if(!s.deals.length)return '<div class="grid g2"><div class="card"><div class="card-head"><h2>Безопасная сделка</h2><span class="badge a">Нет сделок</span></div><p class="muted small" style="line-height:1.7">Выберите кандидата и создайте черновик проверочного цикла. Перед началом стороны согласуют задачу, срок, критерии и стоимость.</p><div class="timeline"><div class="tl"><span class="tl-icon">1</span><div><strong>Задание</strong><p>Конкретный объём работы и ожидаемый результат.</p></div></div><div class="tl"><span class="tl-icon">2</span><div><strong>Резерв бюджета</strong><p></p></div></div><div class="tl"><span class="tl-icon">3</span><div><strong>Приёмка</strong><p>Результат сверяется с заранее согласованными критериями.</p></div></div><div class="tl"><span class="tl-icon">4</span><div><strong>Выплата</strong><p>Выполняется по правилам договора и платёжной интеграции.</p></div></div></div><button class="btn blue" data-view="talent">Выбрать кандидата →</button></div><div class="card"><div class="card-head"><h2>Модель стоимости</h2><span class="badge">Расчёт</span></div>'+breakdown(48)+'</div></div>';
return '<div class="card"><div class="card-head"><div><h2>Проверочные циклы</h2><p class="muted small">Черновики, сохранённые в этом браузере.</p></div><span class="badge b">'+s.deals.length+' создано</span></div><div class="list">'+s.deals.map(function(d){return '<div class="list-row"><div class="mini">'+esc(d.initials)+'</div><div class="grow"><strong>'+esc(d.candidate)+'</strong><small>'+esc(d.task)+'</small><small>'+d.hours+' ч · '+d.created+'</small></div><div style="text-align:right"><strong>'+money(d.total)+'</strong><small>'+esc(d.status)+'</small></div><button class="btn outline" data-deal="'+d.id+'">Открыть</button></div>'}).join('')+'</div></div>'}
function eventRows(limit){return '<div class="list">'+s.events.slice(0,limit||50).map(function(e){return '<div class="list-row"><div class="metric-icon">↗</div><div class="grow"><strong>'+esc(e.title)+'</strong><small>'+esc(e.desc)+'</small></div><span class="muted small">'+esc(e.at)+'</span></div>'}).join('')+'</div>'}
function activityPage(){return '<div class="grid g2"><div class="card"><div class="card-head"><h2>История действий</h2><span class="badge">'+s.events.length+' событий</span></div>'+(s.events.length?eventRows():'<div class="empty"><strong>История пока пуста</strong>События появятся после первых действий.</div>')+'</div><div class="card"><div class="card-head"><h2>Статусы</h2></div><div class="list-row"><div class="metric-icon">↗</div><div class="grow"><strong>Отклики и выборы</strong><small>Демо-действия пользователей</small></div><span class="badge b">'+s.swipes.filter(function(x){return x.type==='like'}).length+'</span></div><div class="list-row"><div class="metric-icon">◈</div><div class="grow"><strong>Черновики проверок</strong><small>Без движения денег</small></div><span class="badge a">'+s.deals.length+'</span></div><div class="list-row"><div class="metric-icon">✓</div><div class="grow"><strong>Завершённые сделки</strong><small>Приёмка не подключена</small></div><span class="badge">0</span></div><div class="notice" style="margin-top:18px"></div></div></div>'}
function settingsPage(){return '<div class="grid g2"><div class="card"><div class="card-head"><h2>Демо-профиль</h2><span class="badge a">Демо</span></div><div class="divider"></div><div class="list-row"><div class="grow"><strong>Текущая роль</strong><small>'+(s.role==='employer'?'Работодатель':'Кандидат')+'</small></div><button class="btn outline" data-action="switch">Сменить</button></div><div class="list-row"><div class="grow"><strong>Сохранение</strong><small>Цель, выборы, сделки и события</small></div><span class="badge g">В браузере</span></div><button class="btn" style="background:#fff0ef;color:#b43d35;margin-top:18px" data-action="reset">Сбросить демо-данные</button></div></div>'}
function bind(){ $('[data-skill-role]').forEach(function(b){b.addEventListener('click',function(){s.selectedSkillRole=b.dataset.skillRole;save();render()})});var sf=$('#skillform');if(sf)sf.addEventListener('submit',function(e){e.preventDefault();var key=sf.dataset.skillKey,r=skillRoles.filter(function(x){return x.key===key})[0],fd=new FormData(sf),correct=0;r.questions.forEach(function(q,i){if(Number(fd.get('q'+i))===q.correct)correct++});var task=String(fd.get('task')||'').trim(),score=Math.round((correct/r.questions.length)*80+(Math.min(task.length,240)/240)*20);s.skillChecks[key]={score:score,correct:correct,task:task,at:new Date().toISOString()};s.selectedSkillRole=key;save();log('Первичная проверка навыков',r.title+' · '+score+'%');render()});$('[data-view]').forEach(function(b){b.addEventListener('click',function(){nav(b.dataset.view)})});$$('[data-role]').forEach(function(b){b.addEventListener('click',function(){role(b.dataset.role)})});
var f=$('#goalform');if(f)f.addEventListener('submit',function(e){e.preventDefault();var fd=new FormData(f);s.goal={title:fd.get('title'),description:fd.get('description'),direction:fd.get('direction'),period:fd.get('period'),result:fd.get('result'),salary:Number(fd.get('salary'))||0,skills:fd.get('skills')};save();log('Бизнес-цель обновлена',s.goal.title);toast('Бизнес-цель сохранена');nav('home')});
$$('[data-swipe]').forEach(function(b){b.addEventListener('click',function(){var seen=s.swipes.filter(function(x){return x.role==='employer'}).map(function(x){return x.id}),c=candidates.filter(function(x){return seen.indexOf(x.id)<0})[0];if(!c)return;s.swipes.push({id:c.id,type:b.dataset.swipe,role:s.role});log(b.dataset.swipe==='like'?'Кандидат выбран':'Кандидат пропущен',c.name+' · '+c.role);save();toast(b.dataset.swipe==='like'?'Кандидат добавлен в выбор':'Карточка пропущена');render()})});
$('[data-vacancy]').forEach(function(b){b.addEventListener('click',function(){var v=vacancies.filter(function(x){return x.id===Number(b.dataset.vacancy)})[0];if(!s.skillChecks[v.roleKey]){s.selectedSkillRole=v.roleKey;save();nav('skills');toast('Сначала пройдите первичную проверку навыков');return}if(s.swipes.some(function(x){return x.role==='candidate'&&x.id===v.id&&x.type==='like'}))return;s.swipes.push({id:v.id,type:'like',role:'candidate'});log('Демо-отклик создан',v.title);save();toast('Отклик сохранён в демо');render()})});
$$('[data-profile]').forEach(function(b){b.addEventListener('click',function(){var c=candidates.filter(function(x){return x.id===Number(b.dataset.profile)})[0];toast(c.name+' · '+c.role+' · '+c.exp)})});
$$('[data-action="make-deal"]').forEach(function(b){b.addEventListener('click',function(){var chosen=s.swipes.filter(function(x){return x.role==='employer'&&x.type==='like'});if(!chosen.length){toast('Сначала выберите кандидата');return}if(chosen.length>3){toast('В цикле допускается не более 3 кандидатов');return}var c=candidates.filter(function(x){return x.id===chosen[0].id})[0];var task=prompt('Задача для проверочного цикла:',s.goal.result);if(task===null)return;if(!task.trim()){toast('Опишите задачу');return}var h=Number(prompt('Длительность от 2 до 48 часов:','8'));if(!Number.isInteger(h)||h<2||h>48){toast('Укажите целое число часов от 2 до 48');return}var base=h*1500,fee=Math.round(base*.12);s.deals.unshift({id:Date.now(),candidate:c.name,initials:c.initials,task:task.trim(),hours:h,total:base+fee,status:'Черновик · ждёт согласования',created:new Date().toLocaleDateString('ru-RU')});log('Создан черновик безопасной сделки',c.name+' · '+h+' ч · '+money(base+fee));save();toast('Черновик создан. Деньги не списываются.');nav('deals')})});
$$('[data-vacancy]').forEach(function(){});
$$('[data-deal]').forEach(function(b){b.addEventListener('click',function(){var d=s.deals.filter(function(x){return x.id===Number(b.dataset.deal)})[0];toast(d.candidate+' · '+d.hours+' ч · '+money(d.total)+' · '+d.status)})});
$$('[data-action="switch"]').forEach(function(b){b.addEventListener('click',function(){role(s.role==='employer'?'candidate':'employer')})});
$('[data-action="reset"]').forEach(function(b){b.addEventListener('click',function(){if(confirm('Сбросить демо-данные в этом браузере?')){localStorage.removeItem('incore-web-state');s=Object.assign({},defaults,{goal:Object.assign({},defaults.goal),swipes:[],deals:[],events:[]});save();render();toast('Демо-данные сброшены')}});});
}
render();
})();
</script></body></html>
