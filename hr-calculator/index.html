<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hr-calculator/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InCore - Smart Contracts for Insurance Agents</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' https://fonts.gstatic.com;">
    <style>
      #incore-language-switcher {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 99999;
        display: none;
        gap: 4px;
        padding: 4px;
        border: 1px solid rgba(148,163,184,.35);
        border-radius: 12px;
        background: rgba(255,255,255,.94);
        box-shadow: 0 8px 24px rgba(15,23,42,.12);
        -webkit-backdrop-filter: blur(8px);
                backdrop-filter: blur(8px);
        font-family: Arial, sans-serif;
      }
      #incore-language-switcher button {
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #64748b;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        padding: 7px 9px;
      }
      #incore-language-switcher button.active {
        background: #eef2ff;
        color: #4338ca;
      }
      @media (max-width: 640px) {
        #incore-language-switcher { top: 10px; right: 10px; }
        #incore-language-switcher button { padding: 6px 7px; }
      }
    </style>
    <script type="module" crossorigin src="/hr-calculator/assets/index-Bo3FZ0qg.js"></script>
    <link rel="stylesheet" crossorigin href="/hr-calculator/assets/index-B5da6YUu.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="incore-language-switcher" aria-label="Language selector">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="kk">KK</button>
      <button type="button" data-lang="az">AZ</button>
    </div>
    <script>
      (function () {
        var isHrCalculator = window.location.pathname.indexOf('/hr-calculator') !== -1;
        if (!isHrCalculator) return;
        var switcher = document.getElementById('incore-language-switcher');
        if (!switcher) return;
        switcher.style.display = 'flex';
        var current = (localStorage.getItem('i18nextLng') || navigator.language || 'ru').toLowerCase().split('-')[0];
        switcher.querySelectorAll('button').forEach(function (button) {
          if (button.getAttribute('data-lang') === current) button.classList.add('active');
          button.addEventListener('click', function () {
            var lang = button.getAttribute('data-lang');
            if (!lang) return;
            localStorage.setItem('i18nextLng', lang);
            window.location.reload();
          });
        });
      })();
    </script>
  </body>
</html>
